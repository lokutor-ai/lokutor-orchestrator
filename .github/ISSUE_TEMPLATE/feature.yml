name: Feature
description: A new capability or a change in behaviour.
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why. What do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should exist when this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. "Done" means all of these hold.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
  - type: checkboxes
    id: risk
    attributes:
      label: Touches
      options:
        - label: production config or infrastructure
        - label: prices, billing or cost figures
        - label: values paired with another repo
        - label: legal text or sub-processors
        - label: another repo (link its issue)
